
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password - Incident Hub</title>
<style>
:root { --green:#239447; --red:#c62828; --orange:#e65100; --ink:#1d2a22; --muted:#5f6b64; --line:#d7ded9; --bg:#f3f6f4; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
.card { width:100%; max-width:440px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:28px; }
h1 { margin:0 0 4px; font-size:1.4rem; }
.sub { margin:0 0 18px; color:var(--muted); font-size:.95rem; }
.steps { display:flex; gap:6px; list-style:none; margin:0 0 22px; padding:0; }
.steps li { flex:1; text-align:center; font-size:.78rem; color:var(--muted); padding-top:8px; border-top:3px solid var(--line); }
.steps li.active { color:var(--ink); font-weight:600; border-color:var(--green); }
.steps li.done { border-color:var(--green); }
label { display:block; margin:0 0 14px; font-weight:600; font-size:.92rem; }
input, select { display:block; width:100%; margin-top:6px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; color:var(--ink); }
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline:3px solid #9ad3ad; outline-offset:1px; }
input:disabled { background:#eef1ef; }
.captcha { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.captcha img { height:44px; border:1px solid var(--line); border-radius:6px; }
button { font:inherit; cursor:pointer; }
.primary { width:100%; padding:11px; border:0; border-radius:6px; background:var(--green); color:#fff; font-weight:600; }
.primary:disabled { background:#9bb8a5; cursor:not-allowed; }
.ghost { margin-top:10px; width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; background:#fff; }
.ghost:disabled { color:#99a39d; cursor:not-allowed; }
.small { border:1px solid var(--line); border-radius:6px; background:#fff; padding:8px 12px; }
.link { margin-top:12px; background:none; border:0; color:var(--muted); text-decoration:underline; padding:0; }
.msg { min-height:1.4em; margin:10px 0 0; font-size:.92rem; }
.msg.err { color:var(--red); }
.msg.ok { color:var(--green); }
.question { margin:0 0 14px; padding:12px; background:var(--bg); border-radius:6px; font-weight:600; }
.expiry { text-align:center; font-size:1.15rem; font-weight:700; color:var(--green); margin:6px 0 14px; }
.expiry.warning { color:var(--orange); }
.expiry.expired { color:var(--red); }
.otp { text-align:center; letter-spacing:.5em; font-size:1.4rem; }
.meter { height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
.meter span { display:block; height:100%; width:0; background:var(--red); transition:width .2s, background .2s; }
.meter-label { font-size:.85rem; margin:4px 0 8px; color:var(--muted); }
.rules { list-style:none; margin:0 0 14px; padding:0; font-size:.88rem; color:var(--muted); }
.rules li::before { content:"\2717  "; color:var(--red); }
.rules li.ok { color:var(--ink); }
.rules li.ok::before { content:"\2713  "; color:var(--green); }
.back { margin:16px 0 0; text-align:center; font-size:.9rem; }
.back a { color:var(--muted); }
[hidden] { display:none !important; }
</style>
</head>
<body>
<main class="card">
  <h1>Forgot password</h1>
  <p class="sub">Verify your identity to set a new password.</p>

  <ol class="steps" id="steps">
    <li>Account</li>
    <li>Questions</li>
    <li>Verify</li>
    <li>New password</li>
  </ol>

  <!-- Step 1: username + CAPTCHA -->
  <section id="pStart" hidden>
    <form id="fStart" autocomplete="off">
      <label>Username
        <input id="username" minlength="6" maxlength="20" required autocomplete="username">
      </label>

      <div class="captcha">
        <img id="captchaImage" alt="CAPTCHA image">
        <button type="button" class="small" id="refreshCaptcha">Refresh</button>
      </div>

      <label>Type the characters shown
        <input id="captcha" maxlength="10" required autocomplete="off">
      </label>

      <button class="primary" id="startBtn">Continue</button>
      <p class="msg" id="startMsg" role="alert"></p>
    </form>

    <p class="back">
      <a href="../html/Torino.html?mode=login">Back to login</a>
    </p>
  </section>

  <!-- Step 2: registered security questions -->
  <section id="pQuestions" hidden>
    <form id="fQ" autocomplete="off">
      <p class="sub">Choose one of your registered security questions.</p>

      <label>Choose the following question
        <select id="questionCode" required>
          <option value="">Select a security question</option>
        </select>
      </label>

      <label>Your Answer
        <input id="answer" maxlength="100" required autocomplete="off">
      </label>

      <label>Re-enter Answer
        <input id="confirmAnswer" maxlength="100" required autocomplete="off">
      </label>

      <button class="primary" id="qBtn">Continue</button>
      <p class="msg" id="qMsg" role="alert"></p>
    </form>

    <button class="link" type="button" data-cancel>Start over</button>
  </section>

  <!-- Step 3: reset OTP -->
  <section id="pOtp" hidden>
    <form id="fOtp" autocomplete="off">
      <p class="sub" id="otpDesc"></p>

      <p class="expiry" id="otpExpiry" aria-live="polite"></p>

      <label>Six-digit code
        <input
          id="otpCode"
          class="otp"
          inputmode="numeric"
          maxlength="6"
          pattern="\d{6}"
          required
          autocomplete="one-time-code"
        >
      </label>

      <button class="primary" id="verifyBtn">Verify and continue</button>
      <button class="ghost" type="button" id="resendBtn">Resend verification code</button>
      <p class="msg" id="otpMsg" role="alert"></p>
    </form>

    <button class="link" type="button" data-cancel>Start over</button>
  </section>

  <!-- Step 4: change password -->
  <section id="pChange" hidden>
    <form id="fChange" autocomplete="off">
      <label>Enter Password
        <input
          id="newPw"
          type="password"
          minlength="8"
          maxlength="64"
          required
          autocomplete="new-password"
        >
      </label>

      <div class="meter">
        <span id="meterBar"></span>
      </div>

      <p class="meter-label" id="meterLabel">Strength: none</p>
      <ul class="rules" id="rules"></ul>

      <label>Re-enter Password
        <input
          id="confirmPw"
          type="password"
          minlength="8"
          maxlength="64"
          required
          autocomplete="new-password"
        >
      </label>

      <button class="primary" id="changeBtn" disabled>Change password</button>
      <p class="msg" id="changeMsg" role="alert"></p>
    </form>

    <button class="link" type="button" data-cancel>Start over</button>
  </section>

  <!-- Done -->
  <section id="pDone" hidden>
    <p class="question" id="doneMessage">Successfully Change Password</p>

    <a
      class="primary"
      id="loginLink"
      href="../html/Torino.html?mode=login"
      style="display:block;text-align:center;text-decoration:none;"
    >Go to login</a>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const PANELS = ['Start', 'Questions', 'Otp', 'Change', 'Done'];

  const STEP = {
    start: 0,
    questions: 1,
    otp: 2,
    change: 3,
    done: 3
  };

  function show(name) {
    PANELS.forEach(panel => {
      $('p' + panel).hidden = panel.toLowerCase() !== name;
    });

    [...$('steps').children].forEach((li, index) => {
      li.classList.toggle(
        'active',
        index === STEP[name] && name !== 'done'
      );

      li.classList.toggle(
        'done',
        index < STEP[name] || name === 'done'
      );
    });
  }

  function msg(el, text, ok = false) {
    el.textContent = text || '';
    el.className = 'msg' + (text ? (ok ? ' ok' : ' err') : '');
  }

  async function api(action, data = {}) {
    const fd = new FormData();

    fd.append('action', action);

    Object.entries(data).forEach(([key, value]) => {
      fd.append(key, value);
    });

    try {
      const res = await fetch('forgot_api.php', {
        method: 'POST',
        body: fd,
        credentials: 'same-origin'
      });

      return await res.json();
    } catch (e) {
      return {
        success: false,
        message: 'Unable to connect. Please try again.'
      };
    }
  }

  const fmt = seconds =>
    Math.floor(seconds / 60) + ':' +
    String(seconds % 60).padStart(2, '0');

  // ---------- CAPTCHA ----------

  function refreshCaptcha() {
    $('captchaImage').src = '../php/captcha.php?t=' + Date.now();
    $('captcha').value = '';
  }

  // ---------- Step 1: Account ----------

  let startTimer = null;

  function lockStart(seconds) {
    clearInterval(startTimer);

    let left = Math.max(1, Number(seconds) || 10);

    const tick = () => {
      if (left <= 0) {
        clearInterval(startTimer);

        $('startBtn').disabled = false;
        $('startBtn').textContent = 'Continue';

        msg($('startMsg'), 'You can try again now.', true);
        return;
      }

      $('startBtn').disabled = true;
      $('startBtn').textContent = 'Cooldown (' + left + 's)';

      msg(
        $('startMsg'),
        'Too many failed attempts. Please wait ' + left + ' seconds.'
      );

      left--;
    };

    tick();
    startTimer = setInterval(tick, 1000);
  }

  function backToStart(r = {}) {
    stopOtp();
    clearInterval(startTimer);

    show('start');
    refreshCaptcha();

    if (r.lockedOut) {
      lockStart(r.remainingSeconds);
    } else {
      msg($('startMsg'), r.message || '');
    }
  }

  $('refreshCaptcha').addEventListener('click', refreshCaptcha);

  $('fStart').addEventListener('submit', async e => {
    e.preventDefault();

    msg($('startMsg'), '');

    const btn = $('startBtn');
    btn.disabled = true;
    btn.textContent = 'Checking...';

    const r = await api('start', {
      username: $('username').value.trim(),
      captcha: $('captcha').value.trim()
    });

    if (r.refreshCaptcha) {
      refreshCaptcha();
    }

    if (r.success) {
      btn.disabled = false;
      btn.textContent = 'Continue';

      apply(r);
      return;
    }

    if (r.lockedOut) {
      lockStart(r.remainingSeconds);
      return;
    }

    btn.disabled = false;
    btn.textContent = 'Continue';

    msg($('startMsg'), r.message);
  });

  // ---------- Step 2: Security Questions ----------

  function populateQuestions(questions) {
    const select = $('questionCode');

    select.innerHTML = '';

    const defaultOption = document.createElement('option');
    defaultOption.value = '';
    defaultOption.textContent = 'Select a security question';
    select.appendChild(defaultOption);

    if (!questions || typeof questions !== 'object') {
      return;
    }

    Object.entries(questions).forEach(([code, question]) => {
      const option = document.createElement('option');

      option.value = code;
      option.textContent = question;

      select.appendChild(option);
    });
  }

  $('fQ').addEventListener('submit', async e => {
    e.preventDefault();

    const questionCode = $('questionCode').value;
    const answer = $('answer').value.trim();
    const confirmAnswer = $('confirmAnswer').value.trim();

    msg($('qMsg'), '');

    if (!questionCode) {
      msg($('qMsg'), 'Please choose a security question.');
      return;
    }

    if (!answer || !confirmAnswer) {
      msg($('qMsg'), 'Please complete both answer fields.');
      return;
    }

    // Answers must match before the server checks the stored answer.
    if (answer !== confirmAnswer) {
      msg($('qMsg'), 'Your answers do not match.');
      $('confirmAnswer').focus();
      return;
    }

    const btn = $('qBtn');

    btn.disabled = true;
    btn.textContent = 'Checking...';

    const r = await api('answer', {
      question_code: questionCode,
      answer: answer,
      confirm_answer: confirmAnswer
    });

    btn.disabled = false;
    btn.textContent = 'Continue';

    if (r.success) {
      apply(r);
      return;
    }

    if (r.restart) {
      backToStart(r);
      return;
    }

    // Keep the selected question and answers available for correction.
    msg($('qMsg'), r.message);
  });

  // ---------- Step 3: OTP Verification ----------

  let expiresAt = 0;
  let resendAt = 0;
  let lockAt = 0;
  let exhausted = false;
  let busy = false;
  let otpTimer = null;

  function startOtp(s) {
    const now = Date.now();

    expiresAt = now + (Number(s.expiresIn) || 0) * 1000;
    resendAt = now + (Number(s.resendIn) || 0) * 1000;
    lockAt = now + (Number(s.lockIn) || 0) * 1000;

    exhausted = !!s.exhausted;
    busy = false;

    $('otpCode').value = '';
    msg($('otpMsg'), '');

    clearInterval(otpTimer);

    tickOtp();
    otpTimer = setInterval(tickOtp, 500);

    $('otpCode').focus();
  }

  function stopOtp() {
    clearInterval(otpTimer);
  }

  function tickOtp() {
    const now = Date.now();

    const exp = Math.max(
      0,
      Math.ceil((expiresAt - now) / 1000)
    );

    const lock = Math.max(
      0,
      Math.ceil((lockAt - now) / 1000)
    );

    const rs = Math.max(
      0,
      Math.ceil((resendAt - now) / 1000)
    );

    const el = $('otpExpiry');

    el.textContent = exp > 0
      ? 'Code expires in ' + fmt(exp)
      : 'Code expired. Request a new one.';

    el.classList.toggle('warning', exp > 0 && exp <= 10);
    el.classList.toggle('expired', exp === 0);

    const canVerify = exp > 0 && lock === 0 && !exhausted;

    $('otpCode').disabled = !canVerify;
    $('verifyBtn').disabled = busy || !canVerify;

    if (!busy) {
      $('verifyBtn').textContent = lock > 0
        ? 'Locked (' + lock + 's)'
        : 'Verify and continue';

      $('resendBtn').textContent = (rs > 0 || lock > 0)
        ? 'Resend available in ' + Math.max(rs, lock) + 's'
        : 'Resend verification code';
    }

    $('resendBtn').disabled = busy || rs > 0 || lock > 0;
  }

  $('fOtp').addEventListener('submit', async e => {
    e.preventDefault();

    const code = $('otpCode').value.trim();

    if (!/^\d{6}$/.test(code)) {
      msg($('otpMsg'), 'Enter a valid six-digit code.');
      return;
    }

    busy = true;
    $('verifyBtn').textContent = 'Verifying...';

    tickOtp();

    const r = await api('verify_otp', {
      otp: code
    });

    busy = false;

    if (r.success) {
      apply(r);
      return;
    }

    if (r.restart) {
      backToStart(r);
      return;
    }

    if (r.lockedOut) {
      exhausted = true;

      lockAt = Date.now() +
        (Number(r.remainingSeconds) || 60) * 1000;

    } else if (r.needResend) {
      exhausted = true;
    }

    $('otpCode').value = '';

    msg($('otpMsg'), r.message);
    tickOtp();
  });

  $('resendBtn').addEventListener('click', async () => {
    busy = true;

    tickOtp();
    $('resendBtn').textContent = 'Sending...';

    const r = await api('resend_otp');

    busy = false;

    if (r.restart) {
      backToStart(r);
      return;
    }

    if (r.success) {
      startOtp({
        expiresIn: r.expiresIn,
        resendIn: r.resendIn,
        lockIn: 0,
        exhausted: false
      });

      msg($('otpMsg'), r.message, true);
      return;
    }

    if (r.lockedOut) {
      exhausted = true;

      lockAt = Date.now() +
        (Number(r.remainingSeconds) || 60) * 1000;

    } else if (r.remainingSeconds) {
      resendAt = Date.now() +
        Number(r.remainingSeconds) * 1000;
    }

    msg($('otpMsg'), r.message);
    tickOtp();
  });

  // ---------- Step 4: Password Change ----------

  // These are the same password requirements used during registration:
  // 8-64 characters and at least 3 of the 4 character categories.
  const RULES = [
    ['At least 8 characters', p => p.length >= 8],
    ['A lowercase letter', p => /[a-z]/.test(p)],
    ['An uppercase letter', p => /[A-Z]/.test(p)],
    ['A number', p => /[0-9]/.test(p)],
    ['A special character', p => /[^A-Za-z0-9]/.test(p)]
  ];

  RULES.forEach(([text]) => {
    const li = document.createElement('li');
    li.textContent = text;
    $('rules').appendChild(li);
  });

  function getPasswordStrength(password) {
    const categories = [
      /[a-z]/.test(password),
      /[A-Z]/.test(password),
      /[0-9]/.test(password),
      /[^A-Za-z0-9]/.test(password)
    ];

    const categoryCount = categories.filter(Boolean).length;

    if (password.length < 8 || password.length > 64 || categoryCount < 3) {
      return {
        level: 'Weak',
        width: 33,
        color: '#c62828',
        accepted: false
      };
    }

    if (password.length >= 12 && categoryCount === 4) {
      return {
        level: 'Strong',
        width: 100,
        color: '#239447',
        accepted: true
      };
    }

    return {
      level: 'Medium',
      width: 66,
      color: '#e65100',
      accepted: true
    };
  }

  function checkPassword() {
    const password = $('newPw').value;
    const confirmPassword = $('confirmPw').value;

    RULES.forEach(([, test], index) => {
      const passed = test(password);

      $('rules').children[index].classList.toggle('ok', passed);
    });

    const strength = getPasswordStrength(password);

    $('meterBar').style.width = password.length
      ? strength.width + '%'
      : '0%';

    $('meterBar').style.background = strength.color;

    $('meterLabel').textContent = 'Strength: ' +
      (password.length ? strength.level : 'none');

    const passwordsMatch =
      password.length > 0 &&
      confirmPassword.length > 0 &&
      password === confirmPassword;

    const canChange =
      strength.accepted &&
      passwordsMatch;

    $('changeBtn').disabled = !canChange;

    if (confirmPassword && password !== confirmPassword) {
      msg($('changeMsg'), 'Mismatch Password');
    } else {
      msg($('changeMsg'), '');
    }

    return canChange;
  }

  $('newPw').addEventListener('input', checkPassword);
  $('confirmPw').addEventListener('input', checkPassword);

  $('fChange').addEventListener('submit', async e => {
    e.preventDefault();

    if (!checkPassword()) {
      if ($('newPw').value !== $('confirmPw').value) {
        msg($('changeMsg'), 'Mismatch Password');
      } else {
        msg(
          $('changeMsg'),
          'Your password is too weak. Use at least 3 character types.'
        );
      }

      return;
    }

    const btn = $('changeBtn');

    btn.disabled = true;
    btn.textContent = 'Saving...';

    const r = await api('change', {
      password: $('newPw').value,
      confirm: $('confirmPw').value
    });

    btn.textContent = 'Change password';

    if (r.success) {
      if (r.redirect) {
        $('loginLink').href = r.redirect;
      }

      $('doneMessage').textContent = 'Successfully Change Password';

      show('done');
      return;
    }

    if (r.restart) {
      backToStart(r);
      return;
    }

    // This displays server messages such as:
    // "You cannot reuse a recent password."
    // "Mismatch Password"
    msg($('changeMsg'), r.message);

    checkPassword();
  });

  // ---------- Shared Functions ----------

  document.querySelectorAll('[data-cancel]').forEach(button => {
    button.addEventListener('click', async () => {
      await api('cancel');

      backToStart({
        message: ''
      });
    });
  });

  function apply(r) {
    if (r.stage === 'questions') {
      populateQuestions(r.questions);

      $('answer').value = '';
      $('confirmAnswer').value = '';

      msg($('qMsg'), '');

      show('questions');

      $('questionCode').focus();

    } else if (r.stage === 'otp') {
      $('otpDesc').textContent =
        'A verification code was sent to ' + r.maskedEmail + '.';

      startOtp(r);
      show('otp');

    } else if (r.stage === 'change') {
      stopOtp();

      $('newPw').value = '';
      $('confirmPw').value = '';

      msg($('changeMsg'), '');

      checkPassword();
      show('change');

    } else {
      show('start');
      refreshCaptcha();
    }
  }

  // ---------- Initial Page State ----------

  // Resume the current reset step based on the server session.
  api('state').then(r => {
    if (r && r.success) {
      apply(r);
    } else {
      show('start');
      refreshCaptcha();
    }
  });
})();
</script>
</body>
</html>
