<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password - Incident Hub</title>
<style>
:root { --green:#239447; --red:#c62828; --orange:#e65100; --ink:#1d2a22; --muted:#5f6b64; --line:#d7ded9; --bg:#f3f6f4; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
.card { width:100%; max-width:440px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:28px; }
h1 { margin:0 0 4px; font-size:1.4rem; }
.sub { margin:0 0 18px; color:var(--muted); font-size:.95rem; }
.steps { display:flex; gap:6px; list-style:none; margin:0 0 22px; padding:0; }
.steps li { flex:1; text-align:center; font-size:.78rem; color:var(--muted); padding-top:8px; border-top:3px solid var(--line); }
.steps li.active { color:var(--ink); font-weight:600; border-color:var(--green); }
.steps li.done { border-color:var(--green); }
label { display:block; margin:0 0 14px; font-weight:600; font-size:.92rem; }
input { display:block; width:100%; margin-top:6px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; font:inherit; }
input:focus-visible, button:focus-visible, a:focus-visible { outline:3px solid #9ad3ad; outline-offset:1px; }
input:disabled { background:#eef1ef; }
.captcha { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.captcha img { height:44px; border:1px solid var(--line); border-radius:6px; }
button { font:inherit; cursor:pointer; }
.primary { width:100%; padding:11px; border:0; border-radius:6px; background:var(--green); color:#fff; font-weight:600; }
.primary:disabled { background:#9bb8a5; cursor:not-allowed; }
.ghost { margin-top:10px; width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; background:#fff; }
.ghost:disabled { color:#99a39d; cursor:not-allowed; }
.small { border:1px solid var(--line); border-radius:6px; background:#fff; padding:8px 12px; }
.link { margin-top:12px; background:none; border:0; color:var(--muted); text-decoration:underline; padding:0; }
.msg { min-height:1.4em; margin:10px 0 0; font-size:.92rem; }
.msg.err { color:var(--red); } .msg.ok { color:var(--green); }
.question { margin:0 0 14px; padding:12px; background:var(--bg); border-radius:6px; font-weight:600; }
.expiry { text-align:center; font-size:1.15rem; font-weight:700; color:var(--green); margin:6px 0 14px; }
.expiry.warning { color:var(--orange); } .expiry.expired { color:var(--red); }
.otp { text-align:center; letter-spacing:.5em; font-size:1.4rem; }
.meter { height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
.meter span { display:block; height:100%; width:0; background:var(--red); transition:width .2s, background .2s; }
.meter-label { font-size:.85rem; margin:4px 0 8px; color:var(--muted); }
.rules { list-style:none; margin:0 0 14px; padding:0; font-size:.88rem; color:var(--muted); }
.rules li::before { content:"\2717  "; color:var(--red); }
.rules li.ok { color:var(--ink); } .rules li.ok::before { content:"\2713  "; color:var(--green); }
.back { margin:16px 0 0; text-align:center; font-size:.9rem; }
.back a { color:var(--muted); }
[hidden] { display:none !important; }
</style>
</head>
<body>
<main class="card">
  <h1>Forgot password</h1>
  <p class="sub">Verify your identity to set a new password.</p>

  <ol class="steps" id="steps">
    <li>Account</li><li>Questions</li><li>Verify</li><li>New password</li>
  </ol>

  <!-- Step 1: username + CAPTCHA -->
  <section id="pStart" hidden>
    <form id="fStart" autocomplete="off">
      <label>Username
        <input id="username" maxlength="100" required autocomplete="username">
      </label>
      <div class="captcha">
        <img id="captchaImage" alt="CAPTCHA image">
        <button type="button" class="small" id="refreshCaptcha">Refresh</button>
      </div>
      <label>Type the characters shown
        <input id="captcha" maxlength="10" required autocomplete="off">
      </label>
      <button class="primary" id="startBtn">Continue</button>
      <p class="msg" id="startMsg" role="alert"></p>
    </form>
    <p class="back"><a href="../html/Torino.html?mode=login">Back to login</a></p>
  </section>

  <!-- Step 2: security questions (2 rounds) -->
  <section id="pQuestions" hidden>
    <form id="fQ" autocomplete="off">
      <p class="sub" id="qStep"></p>
      <p class="question" id="qText"></p>
      <label>Your answer
        <input id="answer" maxlength="100" required autocomplete="off">
      </label>
      <button class="primary" id="qBtn">Continue</button>
      <p class="msg" id="qMsg" role="alert"></p>
    </form>
    <button class="link" type="button" data-cancel>Start over</button>
  </section>

  <!-- Step 3: reset OTP -->
  <section id="pOtp" hidden>
    <form id="fOtp" autocomplete="off">
      <p class="sub" id="otpDesc"></p>
      <p class="expiry" id="otpExpiry" aria-live="polite"></p>
      <label>Six-digit code
        <input id="otpCode" class="otp" inputmode="numeric" maxlength="6" pattern="\d{6}" required autocomplete="one-time-code">
      </label>
      <button class="primary" id="verifyBtn">Verify and continue</button>
      <button class="ghost" type="button" id="resendBtn">Resend verification code</button>
      <p class="msg" id="otpMsg" role="alert"></p>
    </form>
    <button class="link" type="button" data-cancel>Start over</button>
  </section>

  <!-- Step 4: change password -->
  <section id="pChange" hidden>
    <form id="fChange" autocomplete="off">
      <label>New password
        <input id="newPw" type="password" maxlength="72" required autocomplete="new-password">
      </label>
      <div class="meter"><span id="meterBar"></span></div>
      <p class="meter-label" id="meterLabel">Strength: none</p>
      <ul class="rules" id="rules"></ul>
      <label>Confirm new password
        <input id="confirmPw" type="password" maxlength="72" required autocomplete="new-password">
      </label>
      <button class="primary" id="changeBtn" disabled>Change password</button>
      <p class="msg" id="changeMsg" role="alert"></p>
    </form>
    <button class="link" type="button" data-cancel>Start over</button>
  </section>

  <!-- Done -->
  <section id="pDone" hidden>
    <p class="question">Your password was changed. A confirmation email was sent to your registered address.</p>
    <a class="primary" id="loginLink" href="../html/Torino.html?mode=login" style="display:block;text-align:center;text-decoration:none;">Go to login</a>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const PANELS = ['Start', 'Questions', 'Otp', 'Change', 'Done'];
  const STEP = { start: 0, questions: 1, otp: 2, change: 3, done: 3 };

  function show(name) {
    PANELS.forEach(p => { $('p' + p).hidden = p.toLowerCase() !== name; });
    [...$('steps').children].forEach((li, i) => {
      li.classList.toggle('active', i === STEP[name] && name !== 'done');
      li.classList.toggle('done', i < STEP[name] || name === 'done');
    });
  }

  function msg(el, text, ok = false) {
    el.textContent = text || '';
    el.className = 'msg' + (text ? (ok ? ' ok' : ' err') : '');
  }

  async function api(action, data = {}) {
    const fd = new FormData();
    fd.append('action', action);
    Object.entries(data).forEach(([k, v]) => fd.append(k, v));
    try {
      const res = await fetch('forgot_api.php', { method: 'POST', body: fd, credentials: 'same-origin' });
      return await res.json();
    } catch (e) {
      return { success: false, message: 'Unable to connect. Please try again.' };
    }
  }

  const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

  function refreshCaptcha() {
    $('captchaImage').src = '../php/captcha.php?t=' + Date.now();
    $('captcha').value = '';
  }

  // ---------- Step 1 ----------
  let startTimer = null;

  function lockStart(seconds) {
    clearInterval(startTimer);
    let left = Math.max(1, Number(seconds) || 10);
    const tick = () => {
      if (left <= 0) {
        clearInterval(startTimer);
        $('startBtn').disabled = false;
        $('startBtn').textContent = 'Continue';
        msg($('startMsg'), 'You can try again now.', true);
        return;
      }
      $('startBtn').disabled = true;
      $('startBtn').textContent = 'Cooldown (' + left + 's)';
      msg($('startMsg'), 'Too many failed attempts. Please wait ' + left + ' seconds.');
      left--;
    };
    tick();
    startTimer = setInterval(tick, 1000);
  }

  function backToStart(r) {
    stopOtp();
    show('start');
    refreshCaptcha();
    if (r.lockedOut) lockStart(r.remainingSeconds);
    else msg($('startMsg'), r.message);
  }

  $('refreshCaptcha').addEventListener('click', refreshCaptcha);

  $('fStart').addEventListener('submit', async e => {
    e.preventDefault();
    msg($('startMsg'), '');
    const btn = $('startBtn');
    btn.disabled = true;
    btn.textContent = 'Checking...';

    const r = await api('start', {
      username: $('username').value.trim(),
      captcha: $('captcha').value.trim()
    });

    if (r.refreshCaptcha) refreshCaptcha();

    if (r.success) {
      btn.disabled = false;
      btn.textContent = 'Continue';
      apply(r);
      return;
    }
    if (r.lockedOut) { lockStart(r.remainingSeconds); return; }

    btn.disabled = false;
    btn.textContent = 'Continue';
    msg($('startMsg'), r.message);
  });

  // ---------- Step 2 ----------
  $('fQ').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('qBtn');
    btn.disabled = true;
    btn.textContent = 'Checking...';

    const r = await api('answer', { answer: $('answer').value });

    btn.disabled = false;
    btn.textContent = 'Continue';

    if (r.success) return apply(r);
    if (r.restart) return backToStart(r);

    $('answer').value = '';
    msg($('qMsg'), r.message);
  });

  // ---------- Step 3 ----------
  let expiresAt = 0, resendAt = 0, lockAt = 0, exhausted = false, busy = false, otpTimer = null;

  function startOtp(s) {
    const now = Date.now();
    expiresAt = now + (s.expiresIn || 0) * 1000;
    resendAt = now + (s.resendIn || 0) * 1000;
    lockAt = now + (s.lockIn || 0) * 1000;
    exhausted = !!s.exhausted;
    busy = false;
    $('otpCode').value = '';
    msg($('otpMsg'), '');
    clearInterval(otpTimer);
    tickOtp();
    otpTimer = setInterval(tickOtp, 500);
    $('otpCode').focus();
  }

  function stopOtp() { clearInterval(otpTimer); }

  function tickOtp() {
    const now = Date.now();
    const exp = Math.max(0, Math.ceil((expiresAt - now) / 1000));
    const lock = Math.max(0, Math.ceil((lockAt - now) / 1000));
    const rs = Math.max(0, Math.ceil((resendAt - now) / 1000));

    const el = $('otpExpiry');
    el.textContent = exp > 0 ? 'Code expires in ' + fmt(exp) : 'Code expired. Request a new one.';
    el.classList.toggle('warning', exp > 0 && exp <= 10);
    el.classList.toggle('expired', exp === 0);

    const canVerify = exp > 0 && lock === 0 && !exhausted;
    $('otpCode').disabled = !canVerify;
    $('verifyBtn').disabled = busy || !canVerify;

    if (!busy) {
      $('verifyBtn').textContent = lock > 0 ? 'Locked (' + lock + 's)' : 'Verify and continue';
      $('resendBtn').textContent = (rs > 0 || lock > 0)
        ? 'Resend available in ' + Math.max(rs, lock) + 's'
        : 'Resend verification code';
    }
    $('resendBtn').disabled = busy || rs > 0 || lock > 0;
  }

  $('fOtp').addEventListener('submit', async e => {
    e.preventDefault();
    const code = $('otpCode').value.trim();
    if (!/^\d{6}$/.test(code)) { msg($('otpMsg'), 'Enter a valid six-digit code.'); return; }

    busy = true;
    $('verifyBtn').textContent = 'Verifying...';
    tickOtp();

    const r = await api('verify_otp', { otp: code });
    busy = false;

    if (r.success) return apply(r);
    if (r.restart) return backToStart(r);

    if (r.lockedOut) {
      exhausted = true;
      lockAt = Date.now() + (r.remainingSeconds || 60) * 1000;
    } else if (r.needResend) {
      exhausted = true;
    }

    $('otpCode').value = '';
    msg($('otpMsg'), r.message);
    tickOtp();
  });

  $('resendBtn').addEventListener('click', async () => {
    busy = true;
    tickOtp();
    $('resendBtn').textContent = 'Sending...';

    const r = await api('resend_otp');
    busy = false;

    if (r.restart) return backToStart(r);

    if (r.success) {
      startOtp({ expiresIn: r.expiresIn, resendIn: r.resendIn, lockIn: 0, exhausted: false });
      msg($('otpMsg'), r.message, true);
      return;
    }

    if (r.lockedOut) {
      exhausted = true;
      lockAt = Date.now() + (r.remainingSeconds || 60) * 1000;
    } else if (r.remainingSeconds) {
      resendAt = Date.now() + r.remainingSeconds * 1000;
    }

    msg($('otpMsg'), r.message);
    tickOtp();
  });

  // ---------- Step 4 ----------
  const RULES = [
    ['At least 10 characters', p => p.length >= 10],
    ['A lowercase letter', p => /[a-z]/.test(p)],
    ['An uppercase letter', p => /[A-Z]/.test(p)],
    ['A number', p => /\d/.test(p)],
    ['A symbol', p => /[^A-Za-z0-9]/.test(p)]
  ];

  RULES.forEach(([text]) => {
    const li = document.createElement('li');
    li.textContent = text;
    $('rules').appendChild(li);
  });

  function checkPassword() {
    const p = $('newPw').value;
    let score = 0;

    RULES.forEach(([, test], i) => {
      const ok = test(p);
      $('rules').children[i].classList.toggle('ok', ok);
      if (ok) score++;
    });

    const allRules = score === RULES.length;
    if (p.length >= 14) score++;

    const levels = [
      [0, 'none', '#c62828'], [2, 'Weak', '#c62828'],
      [4, 'Fair', '#e65100'], [5, 'Good', '#7cb342'], [6, 'Strong', '#239447']
    ];
    let level = levels[0];
    levels.forEach(l => { if (score >= l[0] && p.length) level = l; });

    $('meterBar').style.width = Math.round(score / 6 * 100) + '%';
    $('meterBar').style.background = level[2];
    $('meterLabel').textContent = 'Strength: ' + (p.length ? level[1] : 'none');

    $('changeBtn').disabled = !(allRules && p === $('confirmPw').value);
  }

  $('newPw').addEventListener('input', checkPassword);
  $('confirmPw').addEventListener('input', checkPassword);

  $('fChange').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('changeBtn');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const r = await api('change', { password: $('newPw').value, confirm: $('confirmPw').value });

    btn.textContent = 'Change password';

    if (r.success) {
      if (r.redirect) $('loginLink').href = r.redirect;
      show('done');
      return;
    }
    if (r.restart) return backToStart(r);

    msg($('changeMsg'), r.message);
    checkPassword();
  });

  // ---------- Shared ----------
  document.querySelectorAll('[data-cancel]').forEach(b =>
    b.addEventListener('click', async () => {
      await api('cancel');
      backToStart({ message: '' });
    })
  );

  function apply(r) {
    if (r.stage === 'questions') {
      $('qStep').textContent = 'Question ' + r.step + ' of ' + r.total;
      $('qText').textContent = r.question;
      $('answer').value = '';
      msg($('qMsg'), '');
      show('questions');
      $('answer').focus();
    } else if (r.stage === 'otp') {
      $('otpDesc').textContent = 'A verification code was sent to ' + r.maskedEmail + '.';
      startOtp(r);
      show('otp');
    } else if (r.stage === 'change') {
      stopOtp();
      $('newPw').value = '';
      $('confirmPw').value = '';
      msg($('changeMsg'), '');
      checkPassword();
      show('change');
    } else {
      show('start');
      refreshCaptcha();
    }
  }

  // On load, resume whichever step the server says the user is on.
  api('state').then(apply);
})();
</script>
</body>
</html>
